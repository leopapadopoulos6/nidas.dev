# Emergency restore of v1 (the archive branch). Builds the 2024 CRA app exactly as it was live.
# CI=false: Netlify sets CI=true, which turns v1's two lint warnings into build errors.
[build]
  base = "nidas.dev"
  command = "CI=false npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
