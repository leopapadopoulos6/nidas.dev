# nidas.dev v2 builds from the repository root (the v1 app in nidas.dev/ is legacy).
[build]
  base = "/"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.0"

# Every site route is prerendered to its own HTML file (/, /2d, /about, ...), so there is no
# SPA catch-all: unknown paths get dist/404.html with a real 404 status.

# Internal design notes are client-rendered from one shell.
[[redirects]]
  from = "/concepts/*"
  to = "/concepts/index.html"
  status = 200

[[headers]]
  for = "/concepts/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Hashed build assets never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
